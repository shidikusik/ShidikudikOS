# Сборка ShidikusikOS: .deb с рабочим окружением, apt-репозиторий и ISO.
# Запуск: push тега v* (например v0.1.0) или вручную (workflow_dispatch —
# тогда создаётся pre-release dev-r<номер запуска>).
name: Release ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Пакет собирается отдельно и публикуется в apt-репозиторий, чтобы
  # установленные системы обновлялись через `apt upgrade`, а не
  # переустановкой ISO.
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: echo "version=1.0.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build .deb in Debian trixie container
        run: |
          mkdir -p out
          sudo docker run --rm -v "$PWD":/work -w /work debian:trixie \
            bash -c "apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends \
                gcc make pkg-config dpkg-dev \
                libpam0g-dev libwlroots-0.18-dev libwayland-dev \
                libxkbcommon-dev wayland-protocols libgtk-3-dev \
                libgtk-layer-shell-dev libsystemd-dev libvte-2.91-dev && \
              ./packaging/build-deb.sh ${{ steps.ver.outputs.version }} /work/out"
          sudo chown -R "$USER" out
          ls -la out

      - name: Publish to apt repository (branch apt-repo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Отдельная ветка-репозиторий: apt тянет её через raw.githubusercontent
          git fetch origin apt-repo || true
          rm -rf /tmp/repo && mkdir -p /tmp/repo
          if git show-ref --quiet refs/remotes/origin/apt-repo; then
            git worktree add /tmp/repo apt-repo
          else
            git worktree add --detach /tmp/repo
            cd /tmp/repo && git checkout --orphan apt-repo && git rm -rf . || true
            cd "$GITHUB_WORKSPACE"
          fi

          cp out/*.deb /tmp/repo/
          cd /tmp/repo
          # держим только три последние версии, чтобы ветка не пухла
          ls -1t shidikusik-desktop_*.deb | tail -n +4 | xargs -r rm -f
          dpkg-scanpackages --multiversion . > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release
          cat > README.md <<'EOF'
          # Репозиторий пакетов ShidikusikOS

          Ветка обновляется автоматически при сборке. Подключение:

          ```sh
          echo 'deb [trusted=yes] https://raw.githubusercontent.com/shidikusik/ShidikudikOS/apt-repo ./' \
            | sudo tee /etc/apt/sources.list.d/shidikusik.list
          sudo apt update && sudo apt install shidikusik-desktop
          ```

          Проще: `sudo shidik-update` в самой системе.
          EOF
          git add -A
          git commit -m "apt: shidikusik-desktop ${{ steps.ver.outputs.version }}" || exit 0
          git push origin apt-repo

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb

  build-iso:
    runs-on: ubuntu-latest
    needs: build-deb
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO in Debian trixie container
        run: |
          sudo docker run --privileged --rm \
            -v "$PWD":/work -w /work/iso debian:trixie \
            bash -c "apt-get update -qq && apt-get install -y -qq live-build && ./build.sh"

      - name: Prepare release metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename artifact
        run: |
          sudo mv iso/live-image-amd64.hybrid.iso \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso"
          sha256sum "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso" \
            > "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso.sha256"

      - name: Create release and upload ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso" \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShidikusikOS ${{ steps.meta.outputs.tag }}" \
            --prerelease=${{ steps.meta.outputs.prerelease }} \
            --generate-notes
