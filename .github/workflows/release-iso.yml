# Сборка ShidikusikOS: .deb с рабочим окружением, apt-репозиторий и ISO.
# Запуск: push тега v* (например v0.1.0) или вручную (workflow_dispatch —
# тогда создаётся pre-release dev-r<номер запуска>).
#
# Всё в одном job: пакет и образ собираются из одного дерева исходников,
# передавать артефакты между job'ами не требуется.
name: Release ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=1.0.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # Пакет собирается отдельно от ISO и публикуется в apt-репозиторий:
      # установленные системы обновляются через `apt upgrade`, а не
      # переустановкой образа.
      - name: Build .deb in Debian trixie container
        run: |
          mkdir -p out
          sudo docker run --rm -v "$PWD":/work -w /work debian:trixie \
            bash -c "apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends \
                gcc make pkg-config dpkg-dev \
                libpam0g-dev libwlroots-0.18-dev libwayland-dev \
                libxkbcommon-dev wayland-protocols libgtk-3-dev \
                libgtk-layer-shell-dev libsystemd-dev libvte-2.91-dev && \
              ./packaging/build-deb.sh ${{ steps.meta.outputs.version }} /work/out"
          sudo chown -R "$USER" out
          ls -la out

      - name: Publish package to apt repository (branch apt-repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils

          REPO_DIR=$(mktemp -d)
          cd "$REPO_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # ветка может ещё не существовать — тогда начинаем с чистой
          if git fetch --depth 1 origin apt-repo 2>/dev/null; then
            git checkout -q -b apt-repo FETCH_HEAD
          else
            git checkout -q -b apt-repo
          fi

          cp "$GITHUB_WORKSPACE"/out/*.deb .
          # держим три последние версии, чтобы ветка не разрасталась
          ls -1t shidikusik-desktop_*.deb | tail -n +4 | xargs -r rm -f
          dpkg-scanpackages --multiversion . > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release
          printf '%s\n' \
            '# Репозиторий пакетов ShidikusikOS' \
            '' \
            'Обновляется автоматически при сборке. Подключение:' \
            '' \
            '    echo "deb [trusted=yes] https://raw.githubusercontent.com/shidikusik/ShidikudikOS/apt-repo ./" | sudo tee /etc/apt/sources.list.d/shidikusik.list' \
            '    sudo apt update && sudo apt install shidikusik-desktop' \
            '' \
            'Проще: sudo shidik-update в самой системе.' \
            > README.md

          git add -A
          git commit -q -m "apt: shidikusik-desktop ${{ steps.meta.outputs.version }}" || exit 0
          git push -q origin apt-repo

      - name: Build ISO in Debian trixie container
        run: |
          sudo docker run --privileged --rm \
            -v "$PWD":/work -w /work/iso debian:trixie \
            bash -c "apt-get update -qq && apt-get install -y -qq live-build && ./build.sh"

      - name: Rename artifact
        run: |
          sudo mv iso/live-image-amd64.hybrid.iso \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso"
          sha256sum "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso" \
            > "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso.sha256"

      - name: Create release and upload ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso" \
            "shidikusikos-${{ steps.meta.outputs.tag }}-amd64.iso.sha256" \
            out/shidikusik-desktop_*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShidikusikOS ${{ steps.meta.outputs.tag }}" \
            --prerelease=${{ steps.meta.outputs.prerelease }} \
            --generate-notes
