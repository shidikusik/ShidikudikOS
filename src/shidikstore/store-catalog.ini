# Каталог витрины Shidik-Store.
# Имя группы = имя пакета в apt (должен существовать в Debian trixie).
# Ключи: Name (обязательный), Comment, Category.
# Пользователь может дописать свои записи сюда же — магазин просто
# читает этот файл при запуске.

