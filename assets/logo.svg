<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ShidikusikOS — логотип: монограмма «S» и блок-курсор.
       Без талисмана и без градиентов: сплошные цвета рисуются
       одинаково во всех отрисовщиках (GTK, ImageMagick, браузер). -->

  <!-- подложка -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1a1b26"/>
  <rect x="8" y="8" width="240" height="240" rx="56"
        fill="none" stroke="#2f3550" stroke-width="2"/>

  <!-- монограмма S -->
  <path d="M 174 92
           C 174 74 150 64 126 64
           C 100 64 78 76 78 98
           C 78 120 104 126 128 130
           C 150 134 174 140 174 160
           C 174 182 150 192 126 192
           C 100 192 78 180 78 162"
        fill="none" stroke="#f0a860" stroke-width="26"
        stroke-linecap="round"/>

  <!-- блок-курсор: намёк на терминал и на то, что система своя -->
  <rect x="186" y="176" width="20" height="20" rx="5" fill="#7aa2f7"/>
</svg>
